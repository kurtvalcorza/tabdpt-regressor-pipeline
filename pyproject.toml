[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tabdpt-regressor-pipeline"
version = "0.1.0"
description = "DIMER-ready TabDPT v1.2 regression integration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=1.25,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.4,<2",
  "huggingface-hub>=0.33.2,<2",
  "pyarrow>=25.0,<26"
]

[project.optional-dependencies]
model = ["tabdpt==1.2.0"]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
