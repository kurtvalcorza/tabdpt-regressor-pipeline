name: Notebook integration execution

on:
  pull_request:
    paths:
      - "tutorials/**"
      - "src/tabdpt_regressor_pipeline/**"
      - "scripts/validate_colab_tutorial.py"
      - ".github/workflows/notebook-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  execute-notebooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DIMER_REPO_REF: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Prepare clean CI notebook runtime
        run: |
          sudo mkdir -p /content
          sudo chown -R "$USER":"$USER" /content
          python -m pip install --upgrade pip==26.2.1
          python -m pip install nbconvert==7.17.1 ipykernel==7.3.0

      # The E2E default path ends with the closing external-artifact section (NOTEBOOK_SPEC 3.0 §19.1): it downloads the
      # pinned sample artifact (a release asset of an earlier recorded run, checked by SHA-256 before extraction) and scores
      # eight holdout rows. That section replaced the separate artifact-inference notebook (KND11), so there is no second
      # notebook to run against this run's export.
      - name: Execute E2E default path in CI
        id: e2e
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute tutorials/tabdpt_regressor_colab.ipynb \
            --output executed-tabdpt-regressor-e2e.ipynb \
            --output-dir /content \
            --ExecutePreprocessor.timeout=2400 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Assert and stage integration outputs
        id: assert-outputs
        run: |
          mkdir -p /content/tabdpt-integration-evidence
          cp /content/executed-tabdpt-regressor-e2e.ipynb /content/tabdpt-integration-evidence/

          for name in \
            tabdpt_regressor_input_manifest.json \
            tabdpt_regressor_evaluation_report.json \
            tabdpt_regressor_predictions.csv \
            tabdpt_regressor_result.json \
            tabdpt_regressor_artifact.zip \
            tabdpt_regressor_external_predictions.csv \
            tabdpt_regressor_external_result.json
          do
            src="$(find "$GITHUB_WORKSPACE" /content -type f -name "$name" -print -quit)"
            test -n "$src"
            cp "$src" "/content/tabdpt-integration-evidence/$name"
          done

      - name: Upload notebook integration evidence
        id: upload-evidence
        if: ${{ always() && steps.e2e.outcome == 'success' && steps.assert-outputs.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tabdpt-regressor-notebook-integration-evidence
          path: /content/tabdpt-integration-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Record integration evidence summary
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          OUTPUT_OUTCOME: ${{ steps.assert-outputs.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-evidence.outcome }}
        run: |
          if [[ "$E2E_OUTCOME" == "success" && "$OUTPUT_OUTCOME" == "success" && "$UPLOAD_OUTCOME" == "success" ]]; then
            INTEGRATION_STATUS="PASS"
          else
            INTEGRATION_STATUS="INCOMPLETE/FAIL"
          fi
          {
            echo "## TabDPT Regressor Notebook Spec 3.0 CI integration execution"
            echo
            echo "- Candidate SHA: \`${DIMER_REPO_REF}\`"
            echo "- Runner: \`${RUNNER_OS}\` / \`${RUNNER_ARCH}\`"
            echo "- Python: \`$(python --version 2>&1)\`"
            echo "- E2E CI execution (including the Section 10 external-artifact section): \`${E2E_OUTCOME}\`"
            echo "- Required output assertions: \`${OUTPUT_OUTCOME}\`"
            echo "- Integration evidence artifact upload: \`${UPLOAD_OUTCOME}\`"
            echo "- CI integration status: **${INTEGRATION_STATUS}**"
            echo "- This GitHub-hosted Ubuntu/Jupyter run takes the default path only (no upload)."
            echo "- It is integration evidence only: it is NOT a Google Colab run and does NOT satisfy the clean supported-Colab release gate tracked by issue #15."
            echo "- Issue #15 remains open and the tutorial registry remains release candidate until exact-revision clean Colab evidence is recorded."
            echo "- Static checks remain separate and are not treated as runtime integration evidence."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail closed unless integration evidence is complete
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          OUTPUT_OUTCOME: ${{ steps.assert-outputs.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-evidence.outcome }}
        run: |
          [[ "$E2E_OUTCOME" == "success" ]]
          [[ "$OUTPUT_OUTCOME" == "success" ]]
          [[ "$UPLOAD_OUTCOME" == "success" ]]
